<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrea Büfé - Galéria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --cream:#f6f0e6;
      --cream2:#efe6d8;
      --ink:#1f1a14;
      --ink2:rgba(31,26,20,.74);
      --line:rgba(31,26,20,.14);
      --accent:#8a5a2b;
      --shadow:0 18px 50px rgba(0,0,0,.12);
      --max:1200px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(1000px 520px at 50% 0%, rgba(138,90,43,.08), transparent 55%),
        linear-gradient(180deg, var(--cream), var(--cream2));
      color:var(--ink);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing:.1px;
    }

    a{color:inherit; text-decoration:none}
    button{font:inherit}
    .container{max-width:var(--max); margin:0 auto; padding:0 22px}

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(10px);
      background:rgba(246,240,230,.78);
      border-bottom:1px solid var(--line);
    }
    .nav{
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:180px;
    }
    .logo{
      width:34px;
      height:34px;
      border-radius:10px;
      background:url("./logo.png") center/cover no-repeat;
      flex:0 0 auto;
    }
    .brand .name{
      font-family:"Cormorant Garamond", serif;
      font-weight:700;
      letter-spacing:.6px;
      font-size:18px;
      line-height:1;
    }
    .brand .sub{
      display:block;
      font-size:11px;
      color:var(--ink2);
      margin-top:2px;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    .menu{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:22px;
      flex:1 1 auto;
    }
    .menu a{
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(31,26,20,.78);
      padding:10px 8px;
      position:relative;
      cursor:pointer;
    }
    .menu a::after{
      content:"";
      position:absolute;
      left:8px;
      right:8px;
      bottom:6px;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(138,90,43,.85), transparent);
      opacity:0;
      transform:translateY(4px);
      transition:.25s ease;
    }
    .menu a:hover{color:var(--ink)}
    .menu a:hover::after{opacity:1; transform:translateY(0)}

    .pill{
      position:relative;
      height:42px;
      padding:0 18px;
      border-radius:14px;
      border:1px solid rgba(138,90,43,.40);
      background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(138,90,43,.10));
      color:var(--ink);
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:12px;
      cursor:pointer;
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
      white-space:nowrap;
      overflow:hidden;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 8px 20px rgba(0,0,0,.05);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .pill::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg, transparent 15%, rgba(255,255,255,.45) 35%, transparent 55%);
      transform:translateX(-120%);
      transition:transform .7s ease;
    }
    .pill:hover{
      background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(138,90,43,.16));
      transform:translateY(-2px);
      box-shadow:0 16px 34px rgba(0,0,0,.12);
      border-color:rgba(138,90,43,.58);
    }
    .pill:hover::before{transform:translateX(120%)}

    .hero{
      position:relative;
      min-height:430px;
      overflow:hidden;
      border-bottom:1px solid var(--line);
      display:grid;
      place-items:center;
      text-align:center;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(760px 420px at 50% 42%, rgba(246,240,230,.28), rgba(31,26,20,.44) 58%, rgba(31,26,20,.62)),
        linear-gradient(180deg, rgba(31,26,20,.26), rgba(31,26,20,.48)),
        url("./image6.jpeg") center/cover no-repeat;
      transform:scale(1.03);
    }
    .hero-inner{
      position:relative;
      z-index:1;
      width:min(820px, calc(100% - 44px));
      padding:28px 26px 24px;
      border-radius:22px;
      border:1px solid rgba(246,240,230,.55);
      background:rgba(246,240,230,.70);
      box-shadow:var(--shadow);
    }
    .kicker{
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(31,26,20,.70);
      margin-bottom:8px;
    }
    h1{
      font-family:"Cormorant Garamond", serif;
      font-size:54px;
      line-height:.92;
      letter-spacing:.08em;
      margin:0;
      text-transform:uppercase;
    }
    .hero-text{
      margin:14px auto 0;
      max-width:640px;
      font-size:13px;
      line-height:1.65;
      color:rgba(31,26,20,.74);
    }

    .section{
      padding:42px 0;
      border-bottom:1px solid var(--line);
    }
    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:18px;
      margin-bottom:20px;
    }
    .section-kicker{
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(31,26,20,.62);
      margin-bottom:8px;
    }
    h2{
      font-family:"Cormorant Garamond", serif;
      font-size:34px;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin:0;
    }
    .section-note{
      max-width:430px;
      color:rgba(31,26,20,.68);
      font-size:13px;
      line-height:1.65;
      margin:0;
    }

    .photo-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
    }
    .photo-card{
      position:relative;
      min-height:260px;
      border-radius:16px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:0 14px 34px rgba(0,0,0,.09);
      background:#e7dccf;
    }
    .photo-card.featured{
      grid-column:span 2;
      min-height:360px;
    }
    .photo-card img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      transition:transform .75s ease, filter .75s ease;
    }
    .photo-card:hover img{
      transform:scale(1.055);
      filter:saturate(1.08) contrast(1.04);
    }
    .photo-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg, transparent 46%, rgba(31,26,20,.58));
      pointer-events:none;
    }
    .photo-caption{
      position:absolute;
      left:16px;
      right:16px;
      bottom:14px;
      z-index:1;
      color:#fff8ee;
      text-shadow:0 2px 12px rgba(0,0,0,.45);
    }
    .photo-caption b{
      display:block;
      font-family:"Cormorant Garamond", serif;
      font-size:22px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .photo-caption span{
      display:block;
      margin-top:2px;
      font-size:12px;
      line-height:1.45;
      color:rgba(255,248,238,.86);
    }

    .video-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:16px;
    }
    .video-card{
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.45);
      box-shadow:0 14px 34px rgba(0,0,0,.08);
      overflow:hidden;
    }
    .video-frame{
      position:relative;
      aspect-ratio:16 / 9;
      background:
        linear-gradient(135deg, rgba(31,26,20,.88), rgba(138,90,43,.52)),
        url("./image6.jpeg") center/cover no-repeat;
    }
    .video-frame iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }
    .video-placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:20px;
      text-align:center;
      color:#fff8ee;
    }
    .play-mark{
      width:58px;
      height:58px;
      border-radius:50%;
      border:1px solid rgba(255,248,238,.6);
      background:rgba(246,240,230,.18);
      display:grid;
      place-items:center;
      margin:0 auto 12px;
      box-shadow:0 12px 32px rgba(0,0,0,.22);
    }
    .play-mark::before{
      content:"";
      width:0;
      height:0;
      border-top:10px solid transparent;
      border-bottom:10px solid transparent;
      border-left:15px solid #fff8ee;
      margin-left:4px;
    }
    .video-placeholder b{
      display:block;
      font-family:"Cormorant Garamond", serif;
      font-size:24px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .video-placeholder span{
      display:block;
      max-width:360px;
      margin:6px auto 0;
      font-size:12px;
      line-height:1.55;
      color:rgba(255,248,238,.86);
    }
    .video-info{
      padding:14px 16px 16px;
    }
    .video-info b{
      display:block;
      font-family:"Cormorant Garamond", serif;
      font-size:21px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .video-info p{
      margin:5px 0 0;
      font-size:12px;
      color:rgba(31,26,20,.66);
      line-height:1.55;
    }

    .hint{
      margin-top:18px;
      padding:16px 18px;
      border:1px solid rgba(138,90,43,.22);
      border-radius:16px;
      background:rgba(255,255,255,.38);
      color:rgba(31,26,20,.70);
      font-size:13px;
      line-height:1.7;
    }
    .hint code{
      font-family:ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size:12px;
      color:var(--accent);
    }

    footer{
      padding:26px 0;
      color:rgba(31,26,20,.62);
      font-size:12px;
      background:rgba(246,240,230,.85);
    }
    .foot{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }

    @media (max-width:980px){
      .menu{display:none}
      .photo-grid,
      .video-grid{grid-template-columns:1fr 1fr}
      .photo-card.featured{grid-column:span 2}
    }

    @media (max-width:640px){
      .container{padding:0 14px}
      .nav{
        height:auto;
        min-height:70px;
        padding:10px 0;
        flex-wrap:wrap;
        justify-content:center;
      }
      .brand{
        width:100%;
        min-width:0;
        justify-content:center;
      }
      .pill{
        height:40px;
        padding:0 14px;
        font-size:11px;
        letter-spacing:.14em;
      }
      .hero{min-height:410px}
      .hero-inner{
        width:calc(100% - 28px);
        padding:22px 18px;
      }
      h1{font-size:36px}
      .section{padding:34px 0}
      .section-head{
        display:block;
      }
      .section-note{
        margin-top:10px;
      }
      .photo-grid,
      .video-grid{grid-template-columns:1fr}
      .photo-card,
      .photo-card.featured{
        grid-column:auto;
        min-height:250px;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="container">
      <div class="nav">
        <a class="brand" href="https://norby9898.github.io/Adnrea-b-f-miniweb/" aria-label="Andrea Büfé - Kezdőlap">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <div class="name">Andrea Büfé</div>
            <span class="sub">Kiskunmajsa</span>
          </div>
        </a>

        <nav class="menu" aria-label="Galéria menü">
          <a href="#fotok">Fotók</a>
          <a href="#videok">Videók</a>
        </nav>

        <a class="pill" href="https://norby9898.github.io/Adnrea-b-f-miniweb/">Főoldal</a>
      </div>
    </div>
  </div>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="kicker">Andrea Büfé pillanatok</div>
        <h1>Galéria</h1>
        <p class="hero-text">Fotók és videók a büfé hangulatából, kínálatából és a strandszezon kedvenc pillanataiból.</p>
      </div>
    </section>

    <section class="section" id="fotok">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="section-kicker">Képek</div>
            <h2>Fotógaléria</h2>
          </div>
          <p class="section-note"></p>
        </div>

        <div class="photo-grid" id="photoGrid"></div>
      </div>
    </section>

    <section class="section" id="videok">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="section-kicker">YouTube</div>
            <h2>Videók</h2>
          </div>
          <p class="section-note"></p>
        </div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="hint">
         
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="foot">
        <div>© <span id="year"></span> Andrea Büfé - Galéria</div>
        <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
          <a href="./index.html" style="color:rgba(31,26,20,.70)">Főoldal</a>
          <a href="#fotok" style="color:rgba(31,26,20,.70)">Fotók</a>
          <a href="#videok" style="color:rgba(31,26,20,.70)">Videók</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const photos = [
      {
        src: "./image4.jpeg",
        title: "Andrea Büfé",
        text: "Friss ízek, nyári hangulat.",
        featured: true
      },
      {
        src: "./image1.jpeg",
        title: "Kínálat",
        text: "Kedvencek egy helyen."
      },
      {
        src: "./image5.jpeg",
        title: "Strandszezon",
        text: "Pillanatok a büfé körül."
      },
      {
        src: "./image3.jpeg",
        title: "Vendégeinknek",
        text: "Barátságos, családias hangulat."
      },
      {
        src: "./image11.jpeg",
        title: "Nyári napok",
        text: "Hűsítő italok és gyors ételek."
      }
    ];

    const videos = [
      {
        youtubeId: "",
        title: "Andrea Büfé videó",
        text: "Ide kerül majd az első YouTube videó."
      },
      {
        youtubeId: "",
        title: "Hangulatvideó",
        text: "Ide kerülhet egy rövid nyári hangulatvideó."
      }
    ];

    const photoGrid = document.getElementById("photoGrid");
    photos.forEach(photo => {
      const card = document.createElement("article");
      card.className = `photo-card${photo.featured ? " featured" : ""}`;
      card.innerHTML = `
        <img src="${photo.src}" alt="${photo.title}">
        <div class="photo-caption">
          <b>${photo.title}</b>
          <span>${photo.text}</span>
        </div>
      `;
      photoGrid.appendChild(card);
    });

    const videoGrid = document.getElementById("videoGrid");
    videos.forEach(video => {
      const card = document.createElement("article");
      card.className = "video-card";

      const embedUrl = video.youtubeId
        ? `https://www.youtube.com/embed/${video.youtubeId}?autoplay=1&mute=1&loop=1&playlist=${video.youtubeId}&playsinline=1&rel=0`
        : "";

      card.innerHTML = `
        <div class="video-frame">
          ${embedUrl ? `
            <iframe
              src="${embedUrl}"
              title="${video.title}"
              allow="autoplay; encrypted-media; picture-in-picture"
              allowfullscreen>
            </iframe>
          ` : `
            <div class="video-placeholder">
              <div>
                <div class="play-mark" aria-hidden="true"></div>
                <b>YouTube videó helye</b>
                <span>Ha megvan a videó linkje, csak a youtubeId mezőt kell kitölteni.</span>
              </div>
            </div>
          `}
        </div>
        <div class="video-info">
          <b>${video.title}</b>
          <p>${video.text}</p>
        </div>
      `;
      videoGrid.appendChild(card);
    });
  </script>
</body>
</html>
